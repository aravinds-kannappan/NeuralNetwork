name: Validate checkpoint research site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify inputs and rebuild site data
        run: python3 scripts/build_site.py
      - name: Check site and artifact links
        run: python3 scripts/check_site.py
      - name: Check generated files are current
        run: git diff --exit-code -- already-clean studies/already-clean
